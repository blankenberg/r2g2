name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            setup.py
            pyproject.toml

      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install --yes r-base

      - name: Install R test dependencies
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e ".libPaths(Sys.getenv('R_LIBS_USER')); install.packages('testthat', repos = 'https://cloud.r-project.org')"
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-library

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

      - name: Run testthat
        run: Rscript tests/testthat.R
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-library
